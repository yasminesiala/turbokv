[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbokv"
version = "0.2.0"
description = "KV-cache compression for LLMs: near-optimal codes with unbiased attention for zero extra bits"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/yasminesiala/turbokv"

[project.optional-dependencies]
bench = ["matplotlib", "torch"]
dev = ["pytest"]

[tool.setuptools]
packages = ["turbokv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
